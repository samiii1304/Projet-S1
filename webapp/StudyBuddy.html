<!DOCTYPE html>
<html lang="fr">
<head>
    <title>StudyBuddy+</title>
    <meta charset="utf-8">
    <script src="StudyBuddy.js"></script>
    <link rel="stylesheet" href="StudyBuddy.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <img src="LOGO-SB-TEST.png" alt="StudyBuddy+ Logo" class="logo">
    <div class="header-right">
        <div class="round-icon"></div>
        <div class="menu-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>
</header>

<div class="banner">
    <h1>Bienvenue *Insert Pseudo*</h1>
</div>


<div class="séparationBannerBody">
</div>




<br><br>





<div class="dashboard-section">
    <h2><i><span class="tableau">Tableau</span> <span class="de-bord">de bord</span></i></h2>
    
    <div class="dashboard-layout">
        <!-- Colonne gauche -->
        <div class="left-column">
            <div class="card large realtime-stats">Statistiques temps réel</div>
            <div class="card medium history">Historique et progression</div>
            <div class="card small controls">Contrôles rapides</div>
        </div>
        
        <!-- Colonne centrale -->
        <div class="center-column">
            <div class="card x-large graph">Graphique productivité</div>
        </div>
        
        <!-- Colonne droite -->
        <div class="right-column">
            <div class="card medium environment">Indicateurs environnementaux</div>
            <div class="card medium advice">Conseils personnalisés</div>
            <div class="card small notifications">Notifications</div>
        </div>
    </div>
</div>
