<!DOCTYPE html>
<html lang="fr">

<head>
    <title>StudyBuddy+ | Connexion</title>
    <meta charset="utf-8">
    <script src="../js/login.js" defer></script>
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Metal&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header>
        <img src="../assets/img/LOGO-SB-TEST3.png" alt="StudyBuddy+ Logo" class="logo">
        <div class="header-right">
            <a href="../html/presentation.html" class="return-btn">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- Titre  -->
    <div class="page-title">
        <h1>StudyBuddy+</h1>
        <p class="page-subtitle">Accès à votre espace d'étude</p>
    </div>

    <!-- Container d'authentification -->
    <div class="auth-container">
        <!-- Section Connexion (Gauche) -->
        <div class="auth-section login-section">
            <div class="auth-box hidden">
                <div class="auth-box-header">
                    <h2><span class="connexion">Connexion</span></h2>
                    <p class="auth-subtitle">Accédez à votre espace personnel</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="loginUsername" name="loginUsername" placeholder="Pseudo" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" name="loginPassword" placeholder="Mot de passe"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn login-btn">
                        <i class="fas fa-sign-in-alt"></i> Se Connecter
                    </button>
                </form>
            </div>
        </div>

        <!-- Section Inscription (Droite) -->
        <div class="auth-section signup-section">
            <div class="auth-box hidden">
                <div class="auth-box-header">
                    <h2><span class="inscription">Inscription</span></h2>
                    <p class="auth-subtitle">Rejoignez la communauté StudyBuddy+</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="signupUsername" name="signupUsername"
                                placeholder="Choisissez un pseudo" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signupPassword" name="signupPassword"
                                placeholder="Mot de passe (min. 6 caractères)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                placeholder="Confirmer le mot de passe" required>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn signup-btn">
                        <i class="fas fa-user-plus"></i> S'inscrire
                    </button>
                </form>
            </div>
        </div>
    </div>

    <br><br><br>

    <footer>
        <div class="footer-card">
            <div class="footer-simple">
                <img src="../assets/img/LOGO-SB-TEST3.png" alt="StudyBuddy+ Logo" class="footer-logo">
                <p class="footer-tagline">Votre compagnon d'étude intelligent</p>
                <p class="footer-copyright">&copy; 2025 StudyBuddy+</p>
            </div>
        </div>
    </footer>
</body>

</html>
