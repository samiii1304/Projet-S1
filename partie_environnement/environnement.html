<!-- Environnement de Travail -->
<div class="work-environment-block">
    <h3 class="environment-title">ENVIRONNEMENT DE TRAVAIL</h3>
    
    <div class="environment-metric">
        <!-- Luminosité -->
        <div class="metric-group">
            <h4>Luminosité :</h4>
            <div class="metric-data-container">
                <div class="metric-value" id="light-value">408</div>
                <span class="metric-unit">lux</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill" id="light-bar"></div>
            </div>
        </div>
        
        <hr>
        
        <!-- Qualité de l'air -->
        <div class="metric-group">
            <h4>Qualité de l'air :</h4>
            <div class="metric-data-container">
                <div class="metric-value" id="air-quality-value">85</div>
                <span class="metric-unit">%</span>
                <span class="air-status" id="air-quality-status">Bonne</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill" id="air-bar"></div>
            </div>
        </div>
        
        <hr>
        
        <!-- Niveau Sonore -->
        <div class="metric-group">
            <h4>Niveau Sonore :</h4>
            <div class="metric-data-container">
                <div class="metric-value" id="sound-value">31</div>
                <span class="metric-unit">db</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill" id="sound-bar"></div>
            </div>
        </div>
    </div>
</div>

<br><br><br>
